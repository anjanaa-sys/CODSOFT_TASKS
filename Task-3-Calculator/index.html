<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Anjana R. - CODSOFT Level 1 Calculator">
  <title>Calculator | Anjana R.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="heading">
      <a href="#" class="brand">ANJANA<span>.</span></a>
      <p>CODSOFT • LEVEL 1 • TASK 3</p>
    </div>

    <section class="calculator" aria-label="Calculator">
      <div class="screen">
        <div id="history" class="history"></div>
        <div id="display" class="display">0</div>
      </div>

      <div class="keys">
        <button class="action" data-action="clear">AC</button>
        <button class="action" data-action="delete">DEL</button>
        <button class="action" data-action="percent">%</button>
        <button class="operator" data-value="÷">÷</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="×">×</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="−">−</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="operator" data-value="+">+</button>

        <button class="zero" data-value="0">0</button>
        <button data-value=".">.</button>
        <button class="equals" data-action="calculate">=</button>
      </div>
    </section>

    <p class="hint">Tip: You can also use your keyboard.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
